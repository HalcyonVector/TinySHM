<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f1f1e">TinySHM beam, side view</text>
  <text x="24" y="56" fill="#5f5e58">Drawn to scale (14 px = 1 cm). One beam is used for every test.</text>

  <!-- table -->
  <rect x="24" y="236" width="296" height="26" fill="#d9b98a" stroke="#8a6a3c"/>
  <rect x="44" y="262" width="16" height="150" fill="#d9b98a" stroke="#8a6a3c"/>
  <text x="72" y="290" fill="#8a6a3c" display="none">Lab table</text>
  <text x="250" y="290" fill="#8a6a3c" font-size="12">table edge</text>
  <line x1="320" y1="236" x2="320" y2="300" stroke="#8a6a3c" stroke-dasharray="3 3"/>

  <!-- stack of 4 heavy books on ruler A, front edge flush with the table edge -->
  <g stroke="#3e2723" stroke-width="1">
    <rect x="132" y="208" width="188" height="22" rx="2" fill="#8d6e63"/>
    <rect x="138" y="186" width="182" height="22" rx="2" fill="#5c6bc0"/>
    <rect x="128" y="164" width="192" height="22" rx="2" fill="#26a69a"/>
    <rect x="142" y="142" width="178" height="22" rx="2" fill="#ef6c00"/>
  </g>
  <text x="150" y="128" font-weight="700" fill="#333">4 heavy books</text>
  <text x="150" y="112" font-size="12" fill="#5f5e58">front edge flush with the table edge</text>

  <!-- ruler A: 30 cm, 20 cm on table, 10 cm out -->
  <rect x="40" y="230" width="420" height="6" fill="#9aa4ad" stroke="#5f6b75"/>
  <text x="196" y="250" font-size="12" fill="#333" display="none">Ruler A</text>
  <!-- ruler B: 30 cm, overlaps 5 cm, tip 35 cm from edge -->
  <rect x="390" y="224" width="420" height="6" fill="#c3ccd4" stroke="#5f6b75"/>
  <text x="350" y="254" fill="#333" font-weight="600" font-size="13">Ruler A</text>
  <text x="600" y="250" fill="#333" font-weight="600">Ruler B</text>

  <!-- binder clips -->
  <rect x="398" y="217" width="9" height="22" rx="1" fill="#1f1f1e"/>
  <rect x="421" y="217" width="9" height="22" rx="1" fill="#1f1f1e"/>
  <rect x="444" y="217" width="9" height="22" rx="1" fill="#1f1f1e"/>
  <text x="436" y="202" fill="#333">3 binder clips</text>

  <!-- sensor 2 cm from tip -->
  <rect x="752" y="212" width="30" height="12" rx="2" fill="#1565c0"/>
  <text x="664" y="150" fill="#1565c0" font-weight="700">Sensor, taped flat</text>
  <text x="664" y="167" fill="#1565c0" font-size="12">MPU6050 (GY-521 board)</text>
  <line x1="767" y1="174" x2="767" y2="210" stroke="#1565c0"/>

  <!-- wires -->
  <path d="M 752 218 L 470 218 C 455 218, 452 208, 436 208 L 340 206 C 328 206, 326 233, 310 233 L 30 233" fill="none" stroke="#e65100" stroke-width="2.5"/>
  <text x="560" y="210" fill="#e65100" font-size="12">wires taped along the ruler</text>
  <text x="72" y="340" fill="#e65100" font-size="12">wires run beside the books,</text><text x="72" y="356" fill="#e65100" font-size="12">loose loop to the LPC1768 board</text>

  <!-- flick -->
  <line x1="838" y1="186" x2="838" y2="262" stroke="#c62828" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="852" y="218" fill="#c62828" font-weight="600">flick</text>
  <text x="852" y="235" fill="#c62828" font-size="12">press 1 to 2 cm,</text>
  <text x="852" y="250" fill="#c62828" font-size="12">slide finger off</text>

  <!-- dimensions -->
  <g stroke="#555" fill="none">
    <line x1="320" y1="322" x2="460" y2="322" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="390" y1="350" x2="460" y2="350" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="782" y1="322" x2="810" y2="322" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="320" y1="384" x2="810" y2="384" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="460" y1="300" x2="460" y2="356" stroke-dasharray="2 3"/>
    <line x1="390" y1="300" x2="390" y2="356" stroke-dasharray="2 3"/>
    <line x1="810" y1="236" x2="810" y2="390" stroke-dasharray="2 3"/>
  </g>
  <text x="330" y="316" fill="#333" font-size="13">A sticks out 10 cm</text>
  <text x="472" y="355" fill="#333" font-size="13">5 cm overlap</text>
  <text x="770" y="314" fill="#333" font-size="13">2 cm</text>
  <text x="470" y="404" fill="#333" font-size="13" font-weight="600">35 cm free length (table edge to tip of B)</text>

  <text x="24" y="444" fill="#5f5e58" font-size="13">Damage by hand: take off 1, 2 or 3 books; remove 1 or 2 clips; tape a coin next to the sensor (a change, not damage).</text>
</svg>
