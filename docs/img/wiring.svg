<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f1f1e">Wiring the sensor to the LPC1768 board</text>
  <text x="24" y="56" fill="#5f5e58">Loose female-to-female jumper wires only, no FRC cable for the sensor. Pick ONE sensor.</text>

  <!-- ===================== LEFT: MPU6050 ===================== -->
  <rect x="16" y="74" width="466" height="420" rx="10" fill="#f6f8fb" stroke="#d5dbe3"/>
  <text x="34" y="102" font-size="16" font-weight="700" fill="#1565c0">A. MPU6050 (GY-521), 4 wires</text>

  <!-- module -->
  <rect x="40" y="124" width="120" height="230" rx="6" fill="#1565c0"/>
  <text x="62" y="148" fill="#fff" font-weight="700">GY-521</text>
  <rect x="78" y="290" width="40" height="40" fill="#0d3c7a"/>
  <text x="80" y="315" fill="#cfe0ff" font-size="10">MPU6050</text>
  <g font-size="12" fill="#fff">
    <circle cx="150" cy="168" r="5" fill="#ffd54f"/><text x="96" y="172">VCC</text>
    <circle cx="150" cy="190" r="5" fill="#ffd54f"/><text x="96" y="194">GND</text>
    <circle cx="150" cy="212" r="5" fill="#ffd54f"/><text x="96" y="216">SCL</text>
    <circle cx="150" cy="234" r="5" fill="#ffd54f"/><text x="96" y="238">SDA</text>
    <circle cx="150" cy="256" r="5" fill="#90a4ae"/><text x="56" y="260" fill="#b8c7d6">XDA XCL</text>
    <circle cx="150" cy="276" r="5" fill="#90a4ae"/><text x="56" y="280" fill="#b8c7d6">AD0 INT</text>
  </g>
  <text x="40" y="374" fill="#5f5e58" font-size="12">Grey pins: leave unconnected</text>

  <!-- board side -->
  <rect x="262" y="124" width="206" height="70" rx="6" fill="#2e7d32"/>
  <text x="276" y="146" fill="#fff" font-weight="700">TP2 "3.3V" post</text>
  <text x="276" y="166" fill="#d7f0d8" font-size="12">POWER SUPPLY box,</text>
  <text x="276" y="182" fill="#d7f0d8" font-size="12">bottom right of the board</text>
  <circle cx="262" cy="168" r="5" fill="#ffd54f"/>

  <rect x="262" y="196" width="206" height="12" rx="3" fill="#212121"/>
  <text x="270" y="206" fill="#fff" font-size="10">TP3 "GND" post (next to TP2)</text>
  <rect x="262" y="214" width="206" height="156" rx="6" fill="#2e7d32"/>
  <text x="276" y="232" fill="#fff" font-weight="700">CNC (no FRC cable!)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="276" y="244" width="146" height="58" rx="3" fill="#1b5e20" stroke="#0f3d13"/>
    <polygon points="276,244 286,244 276,254" fill="#fff"/>
    <g fill="#9ccc9f">
      <circle cx="292" cy="260" r="7"/><circle cx="320" cy="260" r="7"/><circle cx="376" cy="260" r="7"/><circle cx="404" cy="260" r="7"/>
      <circle cx="292" cy="286" r="7"/><circle cx="320" cy="286" r="7"/><circle cx="376" cy="286" r="7"/>
    </g>
    <circle cx="348" cy="260" r="8" fill="#43a047" stroke="#fff" stroke-width="2"/>
    <circle cx="348" cy="286" r="8" fill="#fdd835" stroke="#fff" stroke-width="2"/>
    <circle cx="404" cy="286" r="7" fill="#9ccc9f"/>
    <text x="292" y="264" fill="#0f3d13">1</text><text x="320" y="264" fill="#0f3d13">3</text><text x="348" y="264" fill="#fff">5</text><text x="376" y="264" fill="#0f3d13">7</text><text x="404" y="264" fill="#0f3d13">9</text>
    <text x="292" y="290" fill="#0f3d13">2</text><text x="320" y="290" fill="#0f3d13">4</text><text x="348" y="290" fill="#333">6</text><text x="376" y="290" fill="#0f3d13">8</text><text x="404" y="290" fill="#0f3d13">10</text>
  </g>
  <text x="276" y="328" fill="#fff" font-size="12">5 = P0.19, SDA (middle pair)</text>
  <text x="276" y="344" fill="#fff" font-size="12">6 = P0.20, SCL (middle pair)</text>
  <text x="276" y="360" fill="#fff" font-size="12">Upright socket by the coin cell</text>

  <!-- wires -->
  <path d="M 155 168 L 257 168" stroke="#d32f2f" stroke-width="3.5" fill="none"/>
  <path d="M 155 234 C 200 234, 230 238, 300 238 L 334 238 C 344 238, 348 244, 348 252" stroke="#2e7d32" stroke-width="3.5" fill="none"/>
  <path d="M 155 212 C 205 212, 215 300, 290 300 C 320 300, 336 300, 345 294" stroke="#f9a825" stroke-width="3.5" fill="none"/>
  <path d="M 155 190 C 200 190, 215 200, 250 202 L 257 202" stroke="#212121" stroke-width="3.5" fill="none"/>
  <rect x="200" y="194" width="0" height="0"/>

  <g font-size="12">
    <rect x="34" y="400" width="430" height="84" rx="6" fill="#ffffff" stroke="#d5dbe3"/>
    <rect x="46" y="410" width="14" height="5" fill="#d32f2f"/><text x="66" y="416">VCC to TP2 "3.3V"</text>
    <rect x="250" y="410" width="14" height="5" fill="#212121"/><text x="270" y="416">GND to TP3 "GND"</text>
    <rect x="46" y="432" width="14" height="5" fill="#f9a825"/><text x="66" y="438">SCL to CNC middle pair</text>
    <rect x="250" y="432" width="14" height="5" fill="#2e7d32"/><text x="270" y="438">SDA to CNC middle pair</text>
    <text x="46" y="464" fill="#5f5e58">Works? LCD says "Flick the ruler". If it says</text>
    <text x="46" y="478" fill="#5f5e58">"MPU6050 NOT FOUND", swap SDA and SCL and press reset.</text>
  </g>

  <!-- ===================== RIGHT: ADXL335 ===================== -->
  <rect x="498" y="74" width="466" height="420" rx="10" fill="#fbf8f4" stroke="#e6ddd2"/>
  <text x="516" y="102" font-size="16" font-weight="700" fill="#b85c00">B. ADXL335 (GY-61), 3 wires</text>

  <rect x="522" y="124" width="120" height="200" rx="6" fill="#6a1b9a"/>
  <text x="550" y="148" fill="#fff" font-weight="700">GY-61</text>
  <rect x="560" y="276" width="40" height="40" fill="#3d0f5c"/>
  <text x="562" y="301" fill="#e3cdf2" font-size="10">ADXL335</text>
  <g font-size="12" fill="#fff">
    <circle cx="632" cy="168" r="5" fill="#ffd54f"/><text x="578" y="172">VCC</text>
    <circle cx="632" cy="190" r="5" fill="#90a4ae"/><text x="578" y="194" fill="#d6c3e3">X</text>
    <circle cx="632" cy="212" r="5" fill="#90a4ae"/><text x="578" y="216" fill="#d6c3e3">Y</text>
    <circle cx="632" cy="234" r="5" fill="#ffd54f"/><text x="578" y="238">Z</text>
    <circle cx="632" cy="256" r="5" fill="#ffd54f"/><text x="578" y="260">GND</text>
  </g>
  <text x="522" y="344" fill="#5f5e58" font-size="12">X, Y (and ST if present): leave unconnected</text>

  <rect x="772" y="124" width="170" height="70" rx="6" fill="#2e7d32"/>
  <text x="786" y="146" fill="#fff" font-weight="700">TP2 "3.3V" post</text>
  <text x="786" y="166" fill="#d7f0d8" font-size="12">POWER SUPPLY box,</text>
  <text x="786" y="182" fill="#d7f0d8" font-size="12">bottom right of the board</text>
  <circle cx="772" cy="168" r="5" fill="#ffd54f"/>

  <rect x="772" y="206" width="170" height="74" rx="6" fill="#2e7d32"/>
  <text x="786" y="226" fill="#fff" font-weight="700">JP18, cap OFF</text>
  <g text-anchor="middle" font-size="11">
    <circle cx="800" cy="252" r="7" fill="#9ccc9f"/><text x="800" y="256" fill="#0f3d13">1</text>
    <circle cx="828" cy="252" r="8" fill="#7b1fa2" stroke="#fff" stroke-width="2"/><text x="828" y="256" fill="#fff">2</text>
    <circle cx="856" cy="252" r="7" fill="#9ccc9f"/><text x="856" y="256" fill="#0f3d13">3</text>
  </g>
  <text x="872" y="250" fill="#fff" font-size="11">middle pin</text>
  <text x="872" y="264" fill="#fff" font-size="11">= P1.30</text>

  <rect x="772" y="292" width="170" height="44" rx="6" fill="#2e7d32"/>
  <text x="786" y="312" fill="#fff" font-weight="700">TP3 "GND" post</text>
  <text x="786" y="328" fill="#d7f0d8" font-size="12">next to TP2</text>
  <circle cx="772" cy="314" r="5" fill="#ffd54f"/>

  <path d="M 637 168 L 767 168" stroke="#d32f2f" stroke-width="3.5" fill="none"/>
  <path d="M 637 234 C 700 234, 740 200, 820 248" stroke="#7b1fa2" stroke-width="3.5" fill="none"/>
  <path d="M 637 256 C 700 256, 720 314, 767 314" stroke="#212121" stroke-width="3.5" fill="none"/>

  <g font-size="12">
    <rect x="516" y="400" width="430" height="84" rx="6" fill="#ffffff" stroke="#e6ddd2"/>
    <rect x="528" y="410" width="14" height="5" fill="#d32f2f"/><text x="548" y="416">VCC to TP2 "3.3V"</text>
    <rect x="732" y="410" width="14" height="5" fill="#212121"/><text x="752" y="416">GND to TP3 "GND"</text>
    <rect x="528" y="432" width="14" height="5" fill="#7b1fa2"/><text x="548" y="438">Z to JP18 middle pin (RS485 box, left side)</text>
    <text x="528" y="464" fill="#5f5e58">Works? Flick: the logger readings swing up and down.</text>
    <text x="528" y="478" fill="#5f5e58">Set SENSOR_ADXL335 in both config files first.</text>
  </g>

  <text x="24" y="526" fill="#5f5e58" font-size="13">Both: LCD on CND to CNAD (JP16, JP5), keypad on CNB to CNB3 (JP4 1,2), PC on the DB9 port CN9. Run the wires along the ruler and tape them down.</text>
</svg>
