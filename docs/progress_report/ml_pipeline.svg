<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
  <rect width="1000" height="520" fill="#fff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f1f1e">What the board does with every flick</text>
  <text x="24" y="56" fill="#5f5e58">One flick gives 5 numbers. Six small models then answer six different questions about them.</text>

  <rect x="24" y="84" width="200" height="404" rx="10" fill="#e3f2fd" stroke="#64a5e8"/>
  <text x="40" y="110" font-weight="700" fill="#0d47a1">5 features</text>
  <g font-size="13" fill="#0d3c7a">
    <text x="40" y="142" font-weight="700">f1</text><text x="40" y="160">natural frequency (Hz)</text>
    <text x="40" y="194" font-weight="700">damping</text><text x="40" y="212">how fast it calms down</text>
    <text x="40" y="246" font-weight="700">amplitude</text><text x="40" y="264">how hard it was flicked (g)</text>
    <text x="40" y="298" font-weight="700">energy ratio</text><text x="40" y="316">rattle outside the main peak</text>
    <text x="40" y="350" font-weight="700">decay time</text><text x="40" y="368">seconds until it fades</text>
  </g>
  <text x="40" y="410" font-size="12" fill="#5f5e58">A frequency-only check uses</text>
  <text x="40" y="428" font-size="12" fill="#5f5e58">just f1. The other 4 let the</text>
  <text x="40" y="446" font-size="12" fill="#5f5e58">ML tell faults apart.</text>

  <g font-size="13">
    <rect x="286" y="84" width="330" height="58" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="300" y="106" font-weight="700" fill="#1b5e20">Decision tree (depth 3)</text>
    <text x="300" y="126" fill="#33691e">a few if-else checks: easy to explain</text>
    <rect x="286" y="152" width="330" height="58" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="300" y="174" font-weight="700" fill="#1b5e20">Neural network (5 - 8 - 4)</text>
    <text x="300" y="194" fill="#33691e">main answer, with a confidence %</text>
    <rect x="286" y="220" width="330" height="58" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="300" y="242" font-weight="700" fill="#1b5e20">kNN, k = 3</text>
    <text x="300" y="262" fill="#33691e">closest 3 stored flicks vote (+ teach mode)</text>
    <rect x="286" y="288" width="330" height="58" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="300" y="310" font-weight="700" fill="#1b5e20">kNN health regression</text>
    <text x="300" y="330" fill="#33691e">average damage of the 3 closest flicks</text>
    <rect x="286" y="356" width="330" height="58" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="300" y="378" font-weight="700" fill="#1b5e20">Change detector (z-score)</text>
    <text x="300" y="398" fill="#33691e">distance from the healthy baseline</text>
    <rect x="286" y="424" width="330" height="58" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="300" y="446" font-weight="700" fill="#1b5e20">Novelty detector</text>
    <text x="300" y="466" fill="#33691e">is it far from every flick it knows?</text>
  </g>
  <g stroke="#455a64" stroke-width="2" marker-end="url(#a)">
    <line x1="226" y1="286" x2="284" y2="113"/><line x1="226" y1="286" x2="284" y2="181"/>
    <line x1="226" y1="286" x2="284" y2="249"/><line x1="226" y1="286" x2="284" y2="317"/>
    <line x1="226" y1="286" x2="284" y2="385"/><line x1="226" y1="286" x2="284" y2="453"/>
  </g>

  <g font-size="13">
    <rect x="680" y="84" width="296" height="194" rx="10" fill="#fff4e5" stroke="#f0b35a"/>
    <text x="696" y="110" font-weight="700" fill="#8a4b00">"What is wrong?"</text>
    <text x="696" y="136" fill="#5f4100">HEALTHY, LOOSE SUPPORT,</text>
    <text x="696" y="154" fill="#5f4100">LOOSE JOINT or ADDED MASS</text>
    <text x="696" y="186" fill="#5f4100">Three models give three opinions,</text>
    <text x="696" y="204" fill="#5f4100">so we can compare them</text>
    <rect x="680" y="288" width="296" height="58" rx="10" fill="#fff4e5" stroke="#f0b35a"/>
    <text x="696" y="312" font-weight="700" fill="#8a4b00">"How bad is it?"</text>
    <text x="696" y="332" fill="#5f4100">health 0 to 100 %, below 40 = UNSAFE</text>
    <rect x="680" y="356" width="296" height="58" rx="10" fill="#fff4e5" stroke="#f0b35a"/>
    <text x="696" y="380" font-weight="700" fill="#8a4b00">"Has anything changed?"</text>
    <text x="696" y="400" fill="#5f4100">CHANGED, even before naming it</text>
    <rect x="680" y="424" width="296" height="58" rx="10" fill="#fff4e5" stroke="#f0b35a"/>
    <text x="696" y="448" font-weight="700" fill="#8a4b00">"Have I seen this before?"</text>
    <text x="696" y="468" fill="#5f4100">UNKNOWN for a new kind of fault</text>
  </g>
  <g stroke="#455a64" stroke-width="2" marker-end="url(#a)">
    <line x1="616" y1="113" x2="678" y2="160"/><line x1="616" y1="181" x2="678" y2="181"/>
    <line x1="616" y1="249" x2="678" y2="200"/><line x1="616" y1="317" x2="678" y2="317"/>
    <line x1="616" y1="385" x2="678" y2="385"/><line x1="616" y1="453" x2="678" y2="453"/>
  </g>
</svg>
