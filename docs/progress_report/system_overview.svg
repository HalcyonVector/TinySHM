<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
  <rect width="1000" height="500" fill="#fff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f1f1e">System overview</text>
  <text x="24" y="56" fill="#5f5e58">Everything inside the green box runs on the LPC1768 itself. The laptop only trains the models and writes reports.</text>

  <!-- beam -->
  <rect x="24" y="90" width="170" height="150" rx="10" fill="#fff4e5" stroke="#f0b35a"/>
  <text x="40" y="116" font-weight="700" fill="#8a4b00">Test beam</text>
  <text x="40" y="140" font-size="13" fill="#5f4100">Two steel rulers,</text>
  <text x="40" y="158" font-size="13" fill="#5f4100">clamped to the table,</text>
  <text x="40" y="176" font-size="13" fill="#5f4100">joined by 3 binder clips</text>
  <text x="40" y="206" font-size="13" fill="#5f4100">Faults: loose support,</text>
  <text x="40" y="224" font-size="13" fill="#5f4100">loose joint, added mass</text>

  <rect x="24" y="262" width="170" height="70" rx="10" fill="#e3f2fd" stroke="#64a5e8"/>
  <text x="40" y="288" font-weight="700" fill="#0d47a1">Accelerometer</text>
  <text x="40" y="310" font-size="13" fill="#0d3c7a">MPU6050, read</text>
  <text x="40" y="326" font-size="13" fill="#0d3c7a">over I2C</text>
  <line x1="109" y1="240" x2="109" y2="260" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

  <!-- board -->
  <rect x="236" y="80" width="420" height="370" rx="12" fill="#eef7ee" stroke="#66bb6a" stroke-width="2"/>
  <text x="254" y="106" font-weight="700" fill="#1b5e20">LPC1768 (ARM Cortex-M3) on the lab board</text>
  <line x1="194" y1="297" x2="252" y2="150" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="13">
    <rect x="254" y="122" width="186" height="56" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="266" y="144" font-weight="700" fill="#1b5e20">1. Sample</text>
    <text x="266" y="164" fill="#33691e">100 Hz x 1024 = 10 s</text>

    <rect x="254" y="196" width="186" height="56" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="266" y="218" font-weight="700" fill="#1b5e20">2. Signal processing</text>
    <text x="266" y="238" fill="#33691e">Own FFT + decay envelope</text>

    <rect x="254" y="270" width="186" height="56" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="266" y="292" font-weight="700" fill="#1b5e20">3. Extract 5 features</text>
    <text x="266" y="312" fill="#33691e">frequency, damping, ...</text>

    <rect x="254" y="344" width="186" height="90" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="266" y="366" font-weight="700" fill="#1b5e20">4. On-board ML</text>
    <text x="266" y="386" fill="#33691e">tree, neural net, kNN,</text>
    <text x="266" y="404" fill="#33691e">health score, change and</text>
    <text x="266" y="422" fill="#33691e">unknown-fault detectors</text>

    <line x1="347" y1="178" x2="347" y2="194" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="347" y1="252" x2="347" y2="268" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="347" y1="326" x2="347" y2="342" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

    <rect x="470" y="122" width="170" height="70" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="482" y="144" font-weight="700" fill="#1b5e20">16x2 LCD</text>
    <text x="482" y="164" fill="#33691e">condition, health %</text>
    <text x="482" y="180" fill="#33691e">OK, UNSAFE, UNKNOWN</text>

    <rect x="470" y="206" width="170" height="56" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="482" y="228" font-weight="700" fill="#1b5e20">8 LEDs</text>
    <text x="482" y="248" fill="#33691e">health bar + alarm</text>

    <rect x="470" y="276" width="170" height="56" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="482" y="298" font-weight="700" fill="#1b5e20">4x4 keypad</text>
    <text x="482" y="318" fill="#33691e">teach, calibrate, pages</text>

    <rect x="470" y="346" width="170" height="56" rx="8" fill="#fff" stroke="#9ccc9c"/>
    <text x="482" y="368" font-weight="700" fill="#1b5e20">UART 115200</text>
    <text x="482" y="388" fill="#33691e">results + raw data</text>
  </g>
  <g stroke="#455a64" stroke-width="2" fill="none">
  <polyline points="440,389 455,389 455,157"/>
  <line x1="455" y1="157" x2="468" y2="157" marker-end="url(#a)"/>
  <line x1="455" y1="234" x2="468" y2="234" marker-end="url(#a)"/>
  <line x1="468" y1="304" x2="457" y2="304" marker-end="url(#a)"/>
  <line x1="455" y1="374" x2="468" y2="374" marker-end="url(#a)"/>
  </g>

  <!-- laptop -->
  <rect x="700" y="80" width="276" height="370" rx="12" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2"/>
  <text x="718" y="106" font-weight="700" fill="#4a148c">Laptop (Python)</text>
  <g font-size="13">
    <rect x="716" y="122" width="244" height="50" rx="8" fill="#fff" stroke="#ce93d8"/>
    <text x="728" y="144" font-weight="700" fill="#4a148c">Logger</text>
    <text x="728" y="162" fill="#6a1b9a">saves every flick with its label</text>
    <rect x="716" y="186" width="244" height="64" rx="8" fill="#fff" stroke="#ce93d8"/>
    <text x="728" y="208" font-weight="700" fill="#4a148c">Training</text>
    <text x="728" y="226" fill="#6a1b9a">fits all models, writes them</text>
    <text x="728" y="242" fill="#6a1b9a">as C code (model.h)</text>
    <rect x="716" y="264" width="244" height="50" rx="8" fill="#fff" stroke="#ce93d8"/>
    <text x="728" y="286" font-weight="700" fill="#4a148c">Trend prediction</text>
    <text x="728" y="304" fill="#6a1b9a">when will it become unsafe?</text>
    <rect x="716" y="328" width="244" height="50" rx="8" fill="#fff" stroke="#ce93d8"/>
    <text x="728" y="350" font-weight="700" fill="#4a148c">LLM inspection report</text>
    <text x="728" y="368" fill="#6a1b9a">plain-English summary</text>
    <rect x="716" y="392" width="244" height="44" rx="8" fill="#fff" stroke="#ce93d8"/>
    <text x="728" y="419" font-weight="700" fill="#4a148c">Method comparison (FFT vs ZC)</text>
  </g>
  <polyline points="640,374 678,374 678,147" fill="none" stroke="#455a64" stroke-width="2"/>
  <line x1="678" y1="147" x2="714" y2="147" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="838,450 838,476 347,476 347,438" fill="none" stroke="#8e24aa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="440" y="493" font-size="12" fill="#8e24aa">trained models (model.h) flashed back to the board</text>
</svg>
